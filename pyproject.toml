[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loglens"
version = "3.0.0"
description = "Log intelligence CLI: traffic, errors, endpoint health, latency percentiles, anomalies and suspicious-pattern detection."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
loglens = "loglens.cli:main"

[tool.setuptools]
packages = ["loglens"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
